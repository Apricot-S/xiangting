[package]
name = "xiangting"
description = "A library for calculating the deficiency number (a.k.a. xiàngtīng number, 向聴数)."
version = "6.0.0"
authors = ["Apricot S."]
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/xiangting"
repository = "https://github.com/Apricot-S/xiangting"
keywords = ["mahjong", "riichi", "shanten", "xiangting"]
categories = ["algorithms", "no-std"]

[workspace]
resolver = "3"
members = [".", "xtask"]
default-members = ["."]

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unreadable_literal = "allow"

[lints]
workspace = true

[dependencies]
thiserror = { version = "2.0.17", default-features = false }

[dev-dependencies]
criterion = "0.7.0"
rand = "0.10.0"
rand_pcg = "0.10.0"
shanten-dp = "0.3.2"

[features]
build-map = []
correctness = []

[[bench]]
name = "bench"
harness = false
